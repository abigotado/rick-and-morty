name: CI

on:
  push:
    branches: [main, stage]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check generated code is up to date
        working-directory: packages/rick_and_morty_api
        run: |
          dart run build_runner build
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Check formatting
        run: find lib test packages -name '*.dart' ! -name '*.g.dart' ! -path '*/.dart_tool/*' -print0 | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

      - name: Test packages
        run: |
          for package in packages/*/; do
            if [ -d "${package}test" ]; then
              (cd "$package" && dart test)
            fi
          done

      - name: Test app
        run: flutter test --coverage

  build-android:
    name: Build APK
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Build
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rick-and-morty-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rick-and-morty-apk-symbols
          path: build/symbols
          if-no-files-found: error
          retention-days: 30

  build-web:
    name: Build web
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Build
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # Release only: the debug web runner bootstraps the app with an inline script.
      - name: Add content security policy
        env:
          CSP: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com/flutter-canvaskit/; worker-src 'self'; connect-src 'self' https://rickandmortyapi.com https://www.gstatic.com/flutter-canvaskit/ https://fonts.gstatic.com; img-src 'self' data: blob: https://rickandmortyapi.com; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
        run: |
          sed -i "s|<meta charset=\"UTF-8\">|&\n  <meta http-equiv=\"Content-Security-Policy\" content=\"$CSP\">|" build/web/index.html
          grep -q 'Content-Security-Policy' build/web/index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web

  deploy-web:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
