name: rick_and_morty
description: Rick and Morty character catalog.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: 3.44.8

workspace:
  - packages/characters_data
  - packages/characters_domain
  - packages/rick_and_morty_api

dependencies:
  bloc_concurrency: ^0.3.0
  cached_network_image: ^4.0.3
  characters_data: any
  characters_domain: any
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^18.1.0
  rick_and_morty_api: any

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
